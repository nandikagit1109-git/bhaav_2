# Render Blueprint — Bhaav Backend
# Deploy: Render dashboard → New → Blueprint → connect this GitHub repo.
# Creates a free web service (bhaav-api) + free Postgres (bhaav-db).
# The server runs idempotent migrations on boot and seeds demo data when
# the database is empty, so no manual migration step is needed.

services:
  # ── Backend API ────────────────────────────────────────────────
  - type: web
    name: bhaav-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bhaav-db
          property: connectionString
      - key: CLIENT_ORIGIN
        value: https://bhaav-2.vercel.app
      - key: NODE_ENV
        value: production
      - key: DEMO_SEED
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false  # Optional: set in the Render dashboard for AI insights

# ── PostgreSQL Database ──────────────────────────────────────────
databases:
  - name: bhaav-db
    plan: free
    databaseName: bhaav
    # No ipAllowList → Render default (open to authenticated connections).
    # pg.js connects over TLS with rejectUnauthorized:false, so no extra
    # CA config is needed.
